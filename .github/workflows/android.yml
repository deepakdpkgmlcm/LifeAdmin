name: Build app

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --stacktrace

      - name: Report test results
        if: always()
        run: |
          for f in app/build/test-results/testDebugUnitTest/*.xml; do
            [ -f "$f" ] || continue
            line=$(grep -o '<testsuite [^>]*>' "$f" | head -1)
            name=$(echo "$line" | sed -n 's/.*name="\([^"]*\)".*/\1/p')
            tests=$(echo "$line" | sed -n 's/.*tests="\([0-9]*\)".*/\1/p')
            fails=$(echo "$line" | sed -n 's/.*failures="\([0-9]*\)".*/\1/p')
            errs=$(echo "$line" | sed -n 's/.*errors="\([0-9]*\)".*/\1/p')
            skip=$(echo "$line" | sed -n 's/.*skipped="\([0-9]*\)".*/\1/p')
            echo "::notice title=Tests::$name tests=$tests failures=$fails errors=$errs skipped=$skip"
          done

      - name: Build test APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LifeAdmin-test-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
